name: Skill Matrix

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  matrix:
    name: Generate Skill Matrix and Registry
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun ci

      - name: Generate skill matrix
        run: bun run matrix

      - name: Generate skill registry
        run: bun run registry

      - name: Synchronize plugin manifests and skill router
        run: bun run sync

      - name: Commit updated generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            docs/engineering/skill-matrix.md \
            registry/skills.json \
            .claude-plugin/marketplace.json \
            .claude-plugin/plugin.json \
            .codex-plugin/plugin.json \
            .agents/plugins/marketplace.json \
            SKILL.md
          git diff --cached --quiet || git commit -m "chore(docs): regenerate skill artifacts [skip ci]"
          git push
