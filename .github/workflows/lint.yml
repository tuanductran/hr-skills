name: Lint

on:
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Cancel Previous Runs
        uses: styfle/cancel-workflow-action@0.13.1
        with:
          access_token: ${{ github.token }}

      - name: Check out code
        uses: actions/checkout@v7

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Install Dependencies
        run: bun ci

      - name: Build skill archives from clean checkout
        run: |
          bun run build-skills
          test -s dist/hr-skills.zip
          test -s dist/hr-skills.skill
          zip_listing="$(unzip -Z1 dist/hr-skills.zip)"
          skill_listing="$(unzip -Z1 dist/hr-skills.skill)"
          printf '%s\n' "$zip_listing" | grep -Eq '^skills/.+/SKILL\\.md$'
          printf '%s\n' "$skill_listing" | grep -Eq '^skills/.+/SKILL\\.md$'

      - name: Lint
        run: bun run lint

      - name: Audit source imports
        run: bun run audit:imports > /dev/null

      - name: Lint Markdown
        run: bun run lint:md

      - name: Lint Markdown links
        run: bun run lint:links
