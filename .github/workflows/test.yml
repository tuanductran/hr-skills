name: Test

on:
  pull_request:
    branches: [main, dev]

permissions:
  contents: read
  actions: write

jobs:
  test:
    name: Test (${{matrix.os}})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Cancel Previous Runs
        uses: styfle/cancel-workflow-action@0.13.1
        with:
          access_token: ${{ github.token }}

      - name: Check out code
        uses: actions/checkout@v7

      - name: Cache turbo build setup
        uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Install Dependencies
        run: bun ci

      - name: Run tests
        run: bun run test

      # The playground apps are bundler smoke tests: they only fail when
      # `hr-skills-build/client` stops being browser-safe. They have no `test`
      # script, so `bun run test` never builds them — this step is what makes
      # them assert anything in CI.
      - name: Build (playground client-bundle smoke tests)
        run: bun run build
